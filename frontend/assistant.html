<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>FieryVision AI Assistant | Wildfire Control Room</title>

  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

  <style>
    :root {
      --primary-accent: #e839f9;
      --purple: #9333ea;
      --orange: #fb923c;
      --cyan: #22d3ee;
      --green: #34d399;
      --red: #ef4444;

      --text-main: #e5e7eb;
      --text-secondary: #cbd5e1;
      --text-faint: #94a3b8;

      --glass-bg: rgba(22, 17, 49, 0.78);
      --glass-bg-subtle: rgba(30, 27, 75, 0.48);

      --glass-border: rgba(232, 57, 249, 0.22);
      --glass-border-cyan: rgba(34, 211, 238, 0.25);

      --shadow: 0 15px 40px rgba(0,0,0,.45);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;
    }

    body {
      min-height: 100vh;
      color: var(--text-main);

      background:
        radial-gradient(
          circle at 15% 15%,
          rgba(232,57,249,.18),
          transparent 30%
        ),
        radial-gradient(
          circle at 85% 70%,
          rgba(34,211,238,.13),
          transparent 30%
        ),
        linear-gradient(
          135deg,
          #0f0b2d,
          #24104b 45%,
          #401c42 75%,
          #171126
        );

      background-attachment: fixed;
    }

    button,
    input {
      font: inherit;
    }

    button {
      cursor: pointer;
    }

    .fv-container {
      width: 100%;
      max-width: 1280px;
      margin: auto;
      padding: 0 24px 60px;
    }

    /* ================= NAVBAR ================= */

    .fv-nav-bar {
      margin-top: 16px;
      padding: 15px 20px;

      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 20px;

      background: var(--glass-bg);
      border: 1px solid var(--glass-border);
      border-radius: 15px;

      backdrop-filter: blur(18px);
      box-shadow: var(--shadow);
    }

    .fv-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .fv-brand-icon {
      width: 42px;
      height: 42px;

      display: flex;
      align-items: center;
      justify-content: center;

      border-radius: 10px;

      font-size: 22px;

      background:
        linear-gradient(
          135deg,
          var(--primary-accent),
          var(--orange)
        );

      box-shadow:
        0 0 20px rgba(232,57,249,.35);
    }

    .fv-brand-text h1 {
      font-size: 1.05rem;
      color: white;
    }

    .fv-brand-text p {
      margin-top: 3px;
      font-size: .72rem;
      color: var(--cyan);
    }

    .fv-nav-tabs {
      display: flex;
      gap: 5px;
      padding: 4px;

      background: rgba(5,5,20,.5);
      border-radius: 10px;
    }

    .fv-nav-tab {
      padding: 8px 15px;

      border: 1px solid transparent;
      border-radius: 7px;

      color: var(--text-faint);
      background: transparent;

      font-size: .8rem;
      font-weight: 600;
    }

    .fv-nav-tab.active {
      color: white;

      border-color: var(--primary-accent);

      background:
        linear-gradient(
          135deg,
          rgba(232,57,249,.25),
          rgba(34,211,238,.15)
        );

      box-shadow:
        0 0 15px rgba(232,57,249,.2);
    }

    .fv-nav-tab.disabled {
      opacity: .45;
      cursor: not-allowed;
    }

    .fv-status-pill {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 7px 12px;

      border-radius: 999px;

      color: var(--cyan);
      background: rgba(34,211,238,.08);
      border: 1px solid rgba(34,211,238,.3);

      font-size: .7rem;
      font-weight: 700;
      white-space: nowrap;
    }

    .fv-status-dot {
      width: 8px;
      height: 8px;

      border-radius: 50%;
      background: var(--cyan);

      box-shadow: 0 0 10px var(--cyan);

      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%,100% {
        opacity: 1;
        transform: scale(1);
      }

      50% {
        opacity: .45;
        transform: scale(.8);
      }
    }

    /* ================= HEADER ================= */

    .fv-header-section {
      text-align: center;
      padding: 42px 0 30px;
    }

    .fv-header-title {
      font-size: clamp(2rem,5vw,3rem);
      font-weight: 800;

      background:
        linear-gradient(
          90deg,
          white,
          var(--cyan),
          var(--primary-accent)
        );

      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .fv-header-subtitle {
      margin-top: 8px;
      color: var(--text-secondary);
      font-size: 1rem;
    }

    /* ================= CARD ================= */

    .fv-card {
      position: relative;

      padding: 23px;
      margin-bottom: 20px;

      background: var(--glass-bg);

      border: 1px solid var(--glass-border);
      border-radius: 16px;

      backdrop-filter: blur(16px);

      box-shadow: var(--shadow);
    }

    .fv-input-card {
      overflow: hidden;
    }

    .fv-input-card::before {
      content: "";

      position: absolute;
      top: 0;
      left: 0;

      width: 100%;
      height: 2px;

      background:
        linear-gradient(
          90deg,
          transparent,
          var(--cyan),
          var(--primary-accent),
          transparent
        );
    }

    .fv-card-header {
      display: flex;
      align-items: center;
      gap: 10px;

      margin-bottom: 18px;
    }

    .fv-card-header h2 {
      font-size: 1.05rem;
      color: white;
    }

    .fv-card-header-icon {
      font-size: 20px;
    }

    /* ================= INPUT ================= */

    .fv-form {
      display: grid;
      grid-template-columns: 1fr 1fr auto;
      gap: 17px;
      align-items: end;
    }

    .fv-field-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .fv-label {
      color: var(--text-secondary);

      font-size: .72rem;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: .7px;
    }

    .fv-input {
      width: 100%;

      padding: 12px 14px;

      color: white;

      background: rgba(5,5,20,.65);

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;

      outline: none;
    }

    .fv-input:focus {
      border-color: var(--cyan);

      box-shadow:
        0 0 14px rgba(34,211,238,.2);
    }

    .fv-input.has-error {
      border-color: var(--red);
    }

    .fv-field-error {
      color: #fca5a5;
      font-size: .72rem;
    }

    .fv-btn-primary {
      min-width: 150px;
      height: 46px;

      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;

      padding: 0 22px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--primary-accent),
          #a21caf
        );

      border: 1px solid rgba(255,255,255,.2);
      border-radius: 8px;

      font-weight: 700;

      box-shadow:
        0 0 20px rgba(232,57,249,.25);

      transition: .2s;
    }

    .fv-btn-primary:hover {
      transform: translateY(-2px);
      filter: brightness(1.1);
    }

    .fv-btn-primary:disabled {
      opacity: .6;
      cursor: not-allowed;
      transform: none;
    }

    .fv-spinner {
      width: 17px;
      height: 17px;

      border: 2px solid rgba(255,255,255,.3);
      border-top-color: white;

      border-radius: 50%;

      animation: spin .8s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    /* ================= ERROR ================= */

    .fv-banner-error {
      margin-bottom: 20px;
      padding: 14px 17px;

      color: #fecaca;

      background: rgba(239,68,68,.12);

      border: 1px solid rgba(239,68,68,.4);
      border-radius: 10px;
    }

    /* ================= DASHBOARD ================= */

    .fv-top-summary {
      display: grid;
      grid-template-columns:
        repeat(4, minmax(0,1fr));

      gap: 15px;
      margin-bottom: 20px;
    }

    .fv-metric-tile {
      padding: 17px;

      background: var(--glass-bg-subtle);

      border: 1px solid rgba(255,255,255,.08);
      border-radius: 12px;
    }

    .fv-metric-tile.highlight {
      border-color: var(--glass-border-cyan);

      background:
        rgba(34,211,238,.06);
    }

    .fv-metric-tile-title {
      color: var(--text-faint);

      font-size: .68rem;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: .8px;
    }

    .fv-metric-tile-value {
      margin-top: 7px;

      color: white;

      font-size: 1.4rem;
      font-weight: 800;
    }

    .fv-metric-tile-sub {
      margin-top: 4px;

      color: var(--text-secondary);
      font-size: .72rem;
    }

    /* ================= BADGES ================= */

    .fv-badge {
      display: inline-flex;
      align-items: center;

      padding: 4px 10px;

      border-radius: 6px;

      font-size: .7rem;
      font-weight: 800;

      text-transform: uppercase;
    }

    .fv-badge-danger {
      color: #fca5a5;
      background: rgba(239,68,68,.15);
      border: 1px solid #ef4444;
    }

    .fv-badge-warning {
      color: var(--orange);
      background: rgba(251,146,60,.15);
      border: 1px solid var(--orange);
    }

    .fv-badge-success {
      color: var(--green);
      background: rgba(52,211,153,.12);
      border: 1px solid var(--green);
    }

    .fv-badge-neutral {
      color: var(--text-secondary);
      background: rgba(148,163,184,.12);
      border: 1px solid var(--text-faint);
    }

    /* ================= GRID ================= */

    .fv-grid-3col {
      display: grid;
      grid-template-columns:
        repeat(3,1fr);

      gap: 20px;
      margin-bottom: 20px;
    }

    .fv-grid-2col {
      display: grid;
      grid-template-columns:
        repeat(2,1fr);

      gap: 20px;
      margin-bottom: 20px;
    }

    .fv-section-title {
      display: flex;
      align-items: center;
      gap: 8px;

      margin-bottom: 15px;

      color: var(--cyan);

      font-size: .76rem;
      font-weight: 800;

      text-transform: uppercase;
      letter-spacing: .8px;
    }

    /* ================= DATA ================= */

    .fv-data-table {
      display: flex;
      flex-direction: column;
      gap: 11px;
    }

    .fv-data-row {
      display: flex;
      justify-content: space-between;
      gap: 20px;

      padding-bottom: 9px;

      border-bottom:
        1px solid rgba(255,255,255,.05);

      font-size: .83rem;
    }

    .fv-data-row:last-child {
      border-bottom: none;
    }

    .fv-data-label {
      color: var(--text-secondary);
    }

    .fv-data-val {
      color: white;
      font-weight: 700;
      text-align: right;
      font-family: monospace;
    }

    /* ================= PRIORITY ================= */

    .fv-priority-box {
      padding: 18px;

      border-radius: 12px;

      background:
        linear-gradient(
          135deg,
          rgba(239,68,68,.12),
          rgba(232,57,249,.07)
        );

      border: 1px solid rgba(239,68,68,.25);
    }

    .fv-priority-score {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 12px;
    }

    .fv-score-number {
      font-size: 2.3rem;
      font-weight: 900;
      color: white;
    }

    .fv-score-label {
      color: var(--text-secondary);
      font-size: .75rem;
    }

    .fv-progress {
      width: 100%;
      height: 8px;

      overflow: hidden;

      background: rgba(255,255,255,.08);

      border-radius: 999px;
    }

    .fv-progress-bar {
      height: 100%;

      background:
        linear-gradient(
          90deg,
          var(--orange),
          var(--red),
          var(--primary-accent)
        );

      border-radius: inherit;
    }

    /* ================= SATELLITE ================= */

    .fv-satellite-banner {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;

      padding: 18px 20px;
      margin-bottom: 20px;

      background: rgba(34,211,238,.06);

      border: 1px solid var(--glass-border-cyan);
      border-radius: 12px;
    }

    .fv-satellite-title {
      color: white;
      font-weight: 700;
    }

    .fv-satellite-sub {
      margin-top: 4px;
      color: var(--text-secondary);
      font-size: .78rem;
    }

    .fv-btn-satellite {
      display: flex;
      align-items: center;
      gap: 8px;

      padding: 10px 17px;

      color: white;

      background:
        rgba(34,211,238,.12);

      border: 1px solid var(--cyan);
      border-radius: 8px;

      font-size: .8rem;
      font-weight: 700;

      white-space: nowrap;
    }

    .fv-btn-satellite:hover {
      background: rgba(34,211,238,.2);
    }

    /* ================= AI ================= */

    .fv-ai-card {
      padding: 24px;

      background:
        linear-gradient(
          135deg,
          rgba(22,17,49,.9),
          rgba(45,17,75,.8)
        );

      border: 1px solid rgba(232,57,249,.4);
      border-radius: 16px;

      box-shadow:
        0 8px 32px rgba(232,57,249,.15);
    }

    .fv-ai-tag {
      display: inline-flex;
      align-items: center;
      gap: 6px;

      padding: 5px 10px;

      color: white;

      background:
        linear-gradient(
          135deg,
          var(--primary-accent),
          var(--purple)
        );

      border-radius: 5px;

      font-size: .68rem;
      font-weight: 800;

      letter-spacing: .7px;
    }

    .fv-ai-content {
      margin-top: 15px;
      padding: 16px;

      color: #f1f5f9;

      background: rgba(5,5,20,.35);

      border-left: 3px solid var(--primary-accent);
      border-radius: 0 8px 8px 0;

      font-size: .9rem;
      line-height: 1.65;

      white-space: pre-wrap;
    }

    /* ================= EVIDENCE ================= */

    .fv-evidence-list {
      display: flex;
      flex-direction: column;
      gap: 8px;

      list-style: none;
    }

    .fv-evidence-item {
      padding: 9px 11px;

      display: flex;
      gap: 9px;

      color: var(--text-secondary);

      background: rgba(255,255,255,.03);

      border-radius: 7px;

      font-size: .8rem;
      line-height: 1.45;
    }

    .fv-evidence-icon {
      color: var(--cyan);
    }

    /* ================= CHAT ================= */

    .fv-suggestions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;

      margin: 12px 0 16px;
    }

    .fv-suggestion-chip {
      padding: 7px 12px;

      color: var(--text-secondary);

      background: rgba(255,255,255,.04);

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 999px;

      font-size: .74rem;
    }

    .fv-suggestion-chip:hover {
      color: white;
      border-color: var(--cyan);
      background: rgba(34,211,238,.1);
    }

    .fv-chat-input-row {
      display: flex;
      gap: 9px;
    }

    .fv-chat-input {
      flex: 1;

      padding: 12px;

      color: white;

      background: rgba(5,5,20,.6);

      border: 1px solid rgba(255,255,255,.12);
      border-radius: 8px;

      outline: none;
    }

    .fv-chat-input:focus {
      border-color: var(--cyan);
    }

    .fv-btn-send {
      padding: 0 20px;

      color: #07111f;

      background: var(--cyan);

      border: none;
      border-radius: 8px;

      font-weight: 800;
    }

    .fv-chat-response {
      margin-top: 14px;
      padding: 13px;

      color: var(--text-secondary);

      background: rgba(255,255,255,.04);

      border-radius: 8px;

      font-size: .84rem;
      line-height: 1.5;
    }

    /* ================= MODAL ================= */

    .fv-modal-backdrop {
      position: fixed;
      inset: 0;

      display: flex;
      align-items: center;
      justify-content: center;

      padding: 20px;

      background: rgba(4,3,15,.82);

      backdrop-filter: blur(10px);

      z-index: 9999;
    }

    .fv-modal {
      width: 100%;
      max-width: 680px;
      max-height: 85vh;
      overflow-y: auto;

      padding: 22px;

      background: #151133;

      border: 1px solid var(--glass-border-cyan);
      border-radius: 16px;

      box-shadow: 0 25px 70px rgba(0,0,0,.6);
    }

    .fv-modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;

      margin-bottom: 18px;
    }

    .fv-modal-header h2 {
      color: white;
      font-size: 1.1rem;
    }

    .fv-close {
      width: 32px;
      height: 32px;

      color: white;

      background: rgba(255,255,255,.08);

      border: 1px solid rgba(255,255,255,.1);
      border-radius: 7px;

      font-size: 18px;
    }

    .fv-close:hover {
      background: rgba(239,68,68,.2);
    }

    /* ================= EMPTY ================= */

    .fv-empty-state {
      padding: 50px 20px;

      text-align: center;

      background: rgba(255,255,255,.025);

      border: 1px dashed rgba(255,255,255,.12);

      border-radius: 14px;
    }

    .fv-empty-icon {
      font-size: 40px;
      margin-bottom: 12px;
    }

    .fv-empty-state h3 {
      color: white;
      margin-bottom: 6px;
    }

    .fv-empty-state p {
      color: var(--text-secondary);
      font-size: .84rem;
    }

    /* ================= RESPONSIVE ================= */

    @media(max-width:1000px) {
      .fv-top-summary {
        grid-template-columns: repeat(2,1fr);
      }

      .fv-grid-3col {
        grid-template-columns: 1fr;
      }
    }

    @media(max-width:750px) {

      .fv-nav-bar {
        flex-wrap: wrap;
      }

      .fv-nav-tabs {
        order: 3;
        width: 100%;
        justify-content: center;
      }

      .fv-form,
      .fv-grid-2col {
        grid-template-columns: 1fr;
      }

      .fv-top-summary {
        grid-template-columns: 1fr;
      }

      .fv-satellite-banner {
        align-items: flex-start;
        flex-direction: column;
      }

      .fv-btn-satellite {
        width: 100%;
        justify-content: center;
      }
    }

    @media(max-width:500px) {
      .fv-container {
        padding: 0 12px 40px;
      }

      .fv-card {
        padding: 17px;
      }

      .fv-header-section {
        padding-top: 30px;
      }

      .fv-header-title {
        font-size: 2rem;
      }

      .fv-status-pill {
        margin-left: auto;
      }

      .fv-chat-input-row {
        flex-direction: column;
      }

      .fv-btn-send {
        padding: 12px;
      }
    }
  </style>
</head>

<body>

<div id="root"></div>

<script type="text/babel">

const { useState } = React;

/* =========================================================
   CONFIGURATION
========================================================= */

const API_BASE_URL = "http://127.0.0.1:8000";


/* =========================================================
   APP
========================================================= */

function FieryVisionApp() {

  /* ---------- INPUT ---------- */
  const [latitude, setLatitude] = useState("");
  const [longitude, setLongitude] = useState("");
  const [inputErrors, setInputErrors] = useState({});

  /* ---------- ANALYSIS ---------- */
  const [isAnalysing, setIsAnalysing] = useState(false);
  const [analysisError, setAnalysisError] = useState(null);
  const [analysisData, setAnalysisData] = useState(null);

  /* ---------- CHAT ---------- */
  const [chatQuery, setChatQuery] = useState("");
  const [chatResponse, setChatResponse] = useState("");
  const [isChatLoading, setIsChatLoading] = useState(false);
  const [chatError, setChatError] = useState(null);


  /* =========================================================
     VALIDATION
  ========================================================= */

  const validateCoordinates = (latStr, lonStr) => {
    const errors = {};
    const lat = parseFloat(latStr);
    const lon = parseFloat(lonStr);

    if (latStr.trim() === "" || isNaN(lat)) {
      errors.latitude = "Latitude is required (-90 to 90)";
    } else if (lat < -90 || lat > 90) {
      errors.latitude = "Latitude must be between -90 and +90";
    }

    if (lonStr.trim() === "" || isNaN(lon)) {
      errors.longitude = "Longitude is required (-180 to 180)";
    } else if (lon < -180 || lon > 180) {
      errors.longitude = "Longitude must be between -180 and +180";
    }

    return errors;
  };


  /* =========================================================
     ANALYSE
  ========================================================= */

  const handleAnalyse = async (e) => {
    if (e) e.preventDefault();

    const errors = validateCoordinates(latitude, longitude);
    setInputErrors(errors);
    if (Object.keys(errors).length > 0) return;

    setIsAnalysing(true);
    setAnalysisError(null);
    setAnalysisData(null);
    setChatResponse("");
    setChatError(null);

    try {
      const response = await fetch(
        API_BASE_URL + "/api/analyse-location",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            latitude: parseFloat(latitude),
            longitude: parseFloat(longitude)
          })
        }
      );

      if (!response.ok) {
        const errData = await response.json().catch(() => ({}));
        throw new Error(
          errData.detail ||
          `Backend error: HTTP ${response.status}`
        );
      }

      const data = await response.json();
      setAnalysisData(data);

    } catch (err) {
      setAnalysisError(
        err.message ||
        "Unable to connect to FieryVision backend."
      );
    } finally {
      setIsAnalysing(false);
    }
  };


  /* =========================================================
     CHAT
  ========================================================= */

  const handleChat = async () => {
    const question = chatQuery.trim();
    if (!question) return;

    setIsChatLoading(true);
    setChatResponse("");
    setChatError(null);

    // Build grounded context from current analysis
    const context = analysisData
      ? {
          latitude: analysisData.latitude,
          longitude: analysisData.longitude,
          classification: analysisData.classification,
          classification_method: analysisData.classification_method,
          risk_score: analysisData.risk_score,
          priority: analysisData.priority,
          nearest_facility_name: analysisData.nearest_facility_name,
          nearest_facility_type: analysisData.nearest_facility_type,
          distance_to_facility_m: analysisData.distance_to_facility_m,
          inside_industrial_zone: analysisData.inside_industrial_zone,
          landcover: analysisData.landcover,
          thermal_activity_detected: analysisData.thermal_activity_detected,
          active_anomalies_count: analysisData.active_anomalies_count,
          temporal_summary: analysisData.temporal_summary || {},
          evidence: analysisData.evidence || []
        }
      : {};

    try {
      const response = await fetch(
        API_BASE_URL + "/api/chat",
        {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ question, context })
        }
      );

      if (!response.ok) {
        throw new Error(`Backend error: HTTP ${response.status}`);
      }

      const data = await response.json();
      setChatResponse(data.response || "- No response returned.");
    } catch (err) {
      setChatError("- AI explanation unavailable — backend unreachable.");
    } finally {
      setIsChatLoading(false);
      setChatQuery("");
    }
  };


  /* =========================================================
     HELPERS
  ========================================================= */

  const val = (value, fallback = "Not available") => {
    if (value === undefined || value === null || value === "") {
      return fallback;
    }
    return String(value);
  };

  const formatBullets = (text) => {
    if (!text) return null;
    const lines = text.split("\n").filter(l => l.trim());
    return (
      <ul style={{margin:0, padding:"0 0 0 4px", listStyle:"none"}}>
        {lines.map((line, i) => (
          <li key={i} style={{marginBottom:"6px", lineHeight:"1.5"}}>
            {line.startsWith("•") || line.startsWith("-")
              ? line
              : "• " + line}
          </li>
        ))}
      </ul>
    );
  };

  const temporal = analysisData?.temporal_summary || {};


  /* =========================================================
     RENDER
  ========================================================= */

  return (

    <div className="fv-container">


      {/* ===================================================
          NAVIGATION
      =================================================== */}

      <header className="fv-nav-bar">

        <div className="fv-brand">

          <div className="fv-brand-icon">🛰️</div>

          <div className="fv-brand-text">
            <h1>FieryVision AI Assistant</h1>
            <p>Evidence-backed wildfire intelligence</p>
          </div>

        </div>


        <div className="fv-nav-tabs">

          <a
            href="map.html"
            className="fv-nav-tab"
            style={{textDecoration:"none"}}
          >
            🗺️ Map View
          </a>

          <span className="fv-nav-tab active">
            🤖 AI Assistant
          </span>

        </div>


        <div className="fv-status-pill">
          <div className="fv-status-dot"></div>
          GIASPURA MONITORING
        </div>

      </header>


      {/* ===================================================
          HEADER
      =================================================== */}

      <section className="fv-header-section">
        <h2 className="fv-header-title">FieryVision AI Assistant</h2>
        <p className="fv-header-subtitle">
          Evidence-backed wildfire intelligence · Giaspura, Ludhiana, Punjab
        </p>
      </section>


      {/* ===================================================
          INPUT
      =================================================== */}

      <section className="fv-card fv-input-card">

        <div className="fv-card-header">
          <span className="fv-card-header-icon">📍</span>
          <h2>Coordinate Analysis</h2>
        </div>

        <form className="fv-form" onSubmit={handleAnalyse}>

          <div className="fv-field-group">
            <label className="fv-label">Latitude</label>
            <input
              className={"fv-input " + (inputErrors.latitude ? "has-error" : "")}
              type="text"
              placeholder="e.g. 30.875625"
              value={latitude}
              onChange={(e) => { setLatitude(e.target.value); setInputErrors({}); }}
            />
            {inputErrors.latitude && (
              <div className="fv-field-error">{inputErrors.latitude}</div>
            )}
          </div>

          <div className="fv-field-group">
            <label className="fv-label">Longitude</label>
            <input
              className={"fv-input " + (inputErrors.longitude ? "has-error" : "")}
              type="text"
              placeholder="e.g. 75.898481"
              value={longitude}
              onChange={(e) => { setLongitude(e.target.value); setInputErrors({}); }}
            />
            {inputErrors.longitude && (
              <div className="fv-field-error">{inputErrors.longitude}</div>
            )}
          </div>

          <button
            className="fv-btn-primary"
            type="submit"
            disabled={isAnalysing}
          >
            {isAnalysing ? (
              <><span className="fv-spinner"></span> Analysing...</>
            ) : (
              <>🔍 Analyse Location</>
            )}
          </button>

        </form>

      </section>


      {/* ===================================================
          ERROR
      =================================================== */}

      {analysisError && (
        <div className="fv-banner-error">
          ⚠️ {analysisError}
        </div>
      )}


      {/* ===================================================
          EMPTY STATE
      =================================================== */}

      {!analysisData && !isAnalysing && (
        <section className="fv-empty-state">
          <div className="fv-empty-icon">🔥</div>
          <h3>Awaiting Location Analysis</h3>
          <p>Enter a latitude and longitude above to begin FieryVision assessment.</p>
        </section>
      )}


      {/* ===================================================
          DASHBOARD
      =================================================== */}

      {analysisData && (
        <>

          {/* SUMMARY TILES */}
          <div className="fv-top-summary">

            <div className="fv-metric-tile highlight">
              <div className="fv-metric-tile-title">Priority</div>
              <div className="fv-metric-tile-value">
                <span className="fv-badge fv-badge-danger">
                  {val(analysisData.priority, "Unknown").toUpperCase()}
                </span>
              </div>
              <div className="fv-metric-tile-sub">
                Assessment: {val(analysisData.assessment_mode, "evidence_based")}
              </div>
            </div>

            <div className="fv-metric-tile">
              <div className="fv-metric-tile-title">Risk Score</div>
              <div className="fv-metric-tile-value">
                {analysisData.risk_score != null
                  ? `${analysisData.risk_score}/100`
                  : "Not available"
                }
              </div>
              <div className="fv-metric-tile-sub">Evidence-based assessment</div>
            </div>

            <div className="fv-metric-tile">
              <div className="fv-metric-tile-title">Thermal Activity</div>
              <div className="fv-metric-tile-value">
                {analysisData.thermal_activity_detected ? "Detected" : "None Detected"}
              </div>
              <div className="fv-metric-tile-sub">
                {val(analysisData.active_anomalies_count, 0)} nearby event(s)
              </div>
            </div>

            <div className="fv-metric-tile">
              <div className="fv-metric-tile-title">In Giaspura Zone</div>
              <div className="fv-metric-tile-value">
                {analysisData.in_giaspura_zone ? "Yes" : "No"}
              </div>
              <div className="fv-metric-tile-sub">
                {analysisData.distance_to_giaspura_center_m != null
                  ? `${Math.round(analysisData.distance_to_giaspura_center_m)}m from center`
                  : "Distance unavailable"}
              </div>
            </div>

          </div>


          {/* LOCATION + RISK */}
          <div className="fv-grid-2col">

            <section className="fv-card">
              <div className="fv-section-title">📍 Analysed Location</div>
              <div className="fv-data-table">

                <div className="fv-data-row">
                  <span className="fv-data-label">Latitude</span>
                  <span className="fv-data-val">{val(analysisData.latitude)}</span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Longitude</span>
                  <span className="fv-data-val">{val(analysisData.longitude)}</span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Land Cover</span>
                  <span className="fv-data-val">{val(analysisData.landcover)}</span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Inside Industrial Zone</span>
                  <span className="fv-data-val">
                    {analysisData.inside_industrial_zone != null
                      ? (analysisData.inside_industrial_zone ? "Yes" : "No")
                      : "Not available"}
                  </span>
                </div>

              </div>
            </section>


            <section className="fv-card">
              <div className="fv-section-title">🚨 Risk Assessment</div>
              <div className="fv-priority-box">

                <div className="fv-priority-score">
                  <div>
                    <div className="fv-score-number">
                      {analysisData.risk_score != null ? analysisData.risk_score : "—"}
                    </div>
                    <div className="fv-score-label">Risk Score / 100</div>
                  </div>
                  <span className="fv-badge fv-badge-danger">
                    {val(analysisData.priority, "UNKNOWN").toUpperCase()} PRIORITY
                  </span>
                </div>

                <div className="fv-progress">
                  <div
                    className="fv-progress-bar"
                    style={{ width: `${analysisData.risk_score || 0}%` }}
                  />
                </div>

                <div style={{marginTop:"12px", color:"#cbd5e1", fontSize:".8rem"}}>
                  Method: {val(analysisData.classification_method)}
                </div>

              </div>
            </section>

          </div>


          {/* THERMAL + INDUSTRIAL + PERSISTENCE */}
          <div className="fv-grid-3col">

            {/* THERMAL */}
            <section className="fv-card">
              <div className="fv-section-title">🔥 Thermal Activity</div>
              <div className="fv-data-table">

                <div className="fv-data-row">
                  <span className="fv-data-label">Thermal Detected</span>
                  <span className="fv-data-val">
                    {analysisData.thermal_activity_detected ? "Yes" : "No"}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Nearby Events (1km)</span>
                  <span className="fv-data-val">
                    {val(analysisData.active_anomalies_count, 0)}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Classification</span>
                  <span className="fv-data-val">
                    {val(analysisData.classification)}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Confidence</span>
                  <span className="fv-data-val">
                    {analysisData.classification_confidence != null
                      ? `${analysisData.classification_confidence}%`
                      : "Not available"}
                  </span>
                </div>

              </div>
            </section>


            {/* INDUSTRIAL CONTEXT */}
            <section className="fv-card">
              <div className="fv-section-title">🏭 Industrial Context</div>
              <div className="fv-data-table">

                <div className="fv-data-row">
                  <span className="fv-data-label">Nearest Facility</span>
                  <span className="fv-data-val">
                    {val(analysisData.nearest_facility_name)}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Facility Type</span>
                  <span className="fv-data-val">
                    {val(analysisData.nearest_facility_type)}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Distance</span>
                  <span className="fv-data-val">
                    {analysisData.distance_to_facility_m != null
                      ? `${Math.round(analysisData.distance_to_facility_m)} m`
                      : "Not available"}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">In Industrial Zone</span>
                  <span className="fv-data-val">
                    {analysisData.inside_industrial_zone != null
                      ? (analysisData.inside_industrial_zone ? "Yes" : "No")
                      : "Not available"}
                  </span>
                </div>

              </div>
            </section>


            {/* PERSISTENCE */}
            <section className="fv-card">
              <div className="fv-section-title">📊 Persistence</div>
              <div className="fv-data-table">

                <div className="fv-data-row">
                  <span className="fv-data-label">Status</span>
                  <span className="fv-data-val">
                    {val(temporal.persistence)}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Detections (7d)</span>
                  <span className="fv-data-val">
                    {val(temporal.detections_7d, "Not available")}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">Detections (30d)</span>
                  <span className="fv-data-val">
                    {val(temporal.detections_30d, "Not available")}
                  </span>
                </div>

                <div className="fv-data-row">
                  <span className="fv-data-label">First Seen</span>
                  <span className="fv-data-val">
                    {val(temporal.first_seen)}
                  </span>
                </div>

              </div>
            </section>

          </div>


          {/* AI ASSESSMENT */}
          <section className="fv-ai-card">

            <span className="fv-ai-tag">✨ AI ASSESSMENT</span>

            <div className="fv-ai-content">
              {analysisData.explanation
                ? formatBullets(analysisData.explanation)
                : <span style={{color:"#64748b"}}>AI assessment unavailable for this location.</span>
              }
            </div>

          </section>


          {/* EVIDENCE + CHAT */}
          <div className="fv-grid-2col" style={{marginTop:"20px"}}>

            <section className="fv-card">
              <div className="fv-section-title">📊 Evidence</div>
              {(analysisData.evidence || []).length > 0 ? (
                <ul className="fv-evidence-list">
                  {(analysisData.evidence || []).map((item, index) => (
                    <li className="fv-evidence-item" key={index}>
                      <span className="fv-evidence-icon">✓</span>
                      <span>{item}</span>
                    </li>
                  ))}
                </ul>
              ) : (
                <div style={{color:"#64748b", fontSize:".85rem", padding:"10px 0"}}>
                  No evidence recorded for this location.
                </div>
              )}
            </section>


            {/* ASK FIERYVISION */}
            <section className="fv-card">
              <div className="fv-section-title">💬 Ask FieryVision</div>

              <div className="fv-chat-input-row">
                <input
                  className="fv-chat-input"
                  placeholder="Type your question..."
                  value={chatQuery}
                  disabled={isChatLoading}
                  onChange={(e) => setChatQuery(e.target.value)}
                  onKeyDown={(e) => {
                    if (e.key === "Enter") handleChat();
                  }}
                />
                <button
                  className="fv-btn-send"
                  onClick={handleChat}
                  disabled={isChatLoading || !chatQuery.trim()}
                >
                  {isChatLoading ? <span className="fv-spinner"></span> : "Ask"}
                </button>
              </div>

              {chatError && (
                <div style={{
                  marginTop:"12px",
                  color:"#f87171",
                  fontSize:".85rem",
                  background:"rgba(239,68,68,.08)",
                  border:"1px solid rgba(239,68,68,.22)",
                  borderRadius:"8px",
                  padding:"10px 14px"
                }}>
                  {chatError}
                </div>
              )}

              {chatResponse && (
                <div className="fv-chat-response">
                  {formatBullets(chatResponse)}
                </div>
              )}

            </section>

          </div>

        </>
      )}

    </div>
  );
}


/* =========================================================
   START REACT
========================================================= */

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<FieryVisionApp />);

</script>

</body>
</html>
